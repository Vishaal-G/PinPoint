# Databricks Asset Bundle: the Pinpoint pipeline as a job, defined in the repo.
#   databricks bundle validate    check this file
#   databricks bundle deploy      build the wheel, upload it, create/update the job
#   databricks bundle run pinpoint_pipeline
bundle:
  name: pinpoint

# Deploy-time settings (fixed per target). Run-time settings are job parameters below.
variables:
  catalog:
    default: workspace
  schema_prefix:
    default: pinpoint

artifacts:
  pinpoint_wheel:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: true   # unique version per deploy, so serverless doesn't reuse a cached old wheel

resources:
  jobs:
    pinpoint_pipeline:
      name: pinpoint-pipeline
      parameters:
        - name: repo                       # override per run: Run now with different parameters
          default: pytest-dev/pytest
      tasks:
        - task_key: ingest
          environment_key: default
          python_wheel_task:
            package_name: pinpoint
            entry_point: ingest
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}"]

        - task_key: build_tables
          depends_on:
            - task_key: ingest
          environment_key: default
          max_retries: 1                   # a flaky git clone shouldn't fail the run; tasks are idempotent
          python_wheel_task:
            package_name: pinpoint
            entry_point: build-tables
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}",
                         "--repo", "{{job.parameters.repo}}"]

      environments:
        - environment_key: default
          spec:
            environment_version: "3"      # serverless Python 3.12, matching requires-python
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development   # job name gets a "[dev <user>]" prefix and schedules start paused
    default: true
    workspace:
      host: https://dbc-3c312b22-ef72.cloud.databricks.com
      profile: pinpoint
