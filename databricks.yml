# Databricks Asset Bundle: the Pinpoint pipeline as a job, defined in the repo.
#   databricks bundle validate    check this file
#   databricks bundle deploy      build the wheel, upload it, create/update the job
#   databricks bundle run pinpoint_pipeline
#   databricks bundle run pinpoint_app     deploy + start the Streamlit page as a Databricks App
bundle:
  name: pinpoint

# Deploy-time settings (fixed per target). Run-time settings are job parameters below.
variables:
  catalog:
    default: workspace
  schema_prefix:
    default: pinpoint

# Only these are uploaded as bundle files. The job runs the built wheel and the app installs from GitHub,
# so nothing else is needed, and walking data/ (~10 GB of worktrees) made every validate take minutes.
sync:
  paths:
    - ./deploy

artifacts:
  pinpoint_wheel:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: true   # unique version per deploy, so serverless doesn't reuse a cached old wheel

resources:
  apps:
    pinpoint_app:
      name: pinpoint
      description: "Paste a GitHub issue, get the functions most likely responsible"
      source_code_path: ./deploy/app       # app.yaml, requirements.txt, main.py (code installed from GitHub)
      resources:                           # what the app's service principal may call
        - name: embeddings
          serving_endpoint:
            name: databricks-bge-large-en
            permission: CAN_QUERY
        - name: llm
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY

  jobs:
    pinpoint_pipeline:
      name: pinpoint-pipeline
      parameters:
        - name: repo                       # override per run: Run now with different parameters
          default: pytest-dev/pytest
        - name: slice                      # repo (uses `repo`) | recheck (52) | tune (200) | heldout (100, once)
          default: repo
      tasks:
        - task_key: ingest
          environment_key: default
          python_wheel_task:
            package_name: pinpoint
            entry_point: ingest
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}"]

        - task_key: build_tables
          depends_on:
            - task_key: ingest
          environment_key: default
          max_retries: 1                   # a flaky git clone shouldn't fail the run; tasks are idempotent
          python_wheel_task:
            package_name: pinpoint
            entry_point: build-tables
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}",
                         "--repo", "{{job.parameters.repo}}", "--slice", "{{job.parameters.slice}}"]

        - task_key: embed
          depends_on:
            - task_key: build_tables
          environment_key: default
          max_retries: 2                   # resumes: only bodies missing from the table are embedded
          python_wheel_task:
            package_name: pinpoint
            entry_point: embed
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}",
                         "--repo", "{{job.parameters.repo}}", "--slice", "{{job.parameters.slice}}"]

        - task_key: evaluate
          depends_on:
            - task_key: embed
          environment_key: eval
          python_wheel_task:
            package_name: pinpoint
            entry_point: evaluate
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}",
                         "--repo", "{{job.parameters.repo}}", "--slice", "{{job.parameters.slice}}"]

        - task_key: sync_index             # for the Week 8 API; scoring doesn't need it
          depends_on:
            - task_key: embed
          environment_key: default
          python_wheel_task:
            package_name: pinpoint
            entry_point: sync-index
            parameters: ["--catalog", "${var.catalog}", "--schema-prefix", "${var.schema_prefix}"]

      environments:
        - environment_key: default
          spec:
            environment_version: "3"      # serverless Python 3.12, matching requires-python
            dependencies:
              - ./dist/*.whl
        - environment_key: eval            # + MLflow client, to log runs to the workspace's tracking server
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - mlflow-skinny>=2.21

targets:
  dev:
    mode: development   # job name gets a "[dev <user>]" prefix and schedules start paused
    default: true
    workspace:
      host: https://dbc-3c312b22-ef72.cloud.databricks.com
      profile: pinpoint
