[project]
name = "pinpoint"
version = "0.1.0"
description = "GitHub bot that points to the functions most likely responsible for a new issue"
readme = "README.md"
authors = [
    { name = "Vishaal", email = "vishaaltor@gmail.com" }
]
requires-python = ">=3.12,<3.13"
# What the wheel needs: kept small so Databricks jobs don't replace their preinstalled pandas/pyarrow.
dependencies = [
    "gitpython>=3.2.0",
    "pandas>=2.2",
    "pyarrow>=14",
    "rank-bm25>=0.2.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "unidiff>=1.0.1",
]

[project.scripts]
ingest = "pinpoint.jobs:ingest"
build-tables = "pinpoint.jobs:build_tables"
embed = "pinpoint.jobs:embed"
evaluate = "pinpoint.jobs:evaluate"
sync-index = "pinpoint.jobs:sync_index"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
# Heavy or local-only: installed by `uv sync`, left out of the wheel. Cloud tasks that need
# them list them in their own environment (databricks.yml).
local = [
    "databricks-sdk>=0.155.0",
    "mlflow>=3",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[tool.uv]
default-groups = ["dev", "local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: the default Linux wheel bundles ~2 GB of CUDA libraries we don't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
