[project]
name = "pinpoint"
version = "0.1.0"
description = "GitHub bot that points to the functions most likely responsible for a new issue"
readme = "README.md"
authors = [
    { name = "Vishaal", email = "vishaaltor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "gitpython>=3.2.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "unidiff>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
